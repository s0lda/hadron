name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.33.3)'
        required: false
        default: 'v0.33.3'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev

      - name: Build binaries
        run: |
          cargo build --release --target ${{ matrix.target }} --features gui -p hadron --bins

      - name: Package release archive
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          ARCHIVE_NAME="hadron-${TAG}-${{ matrix.target }}"
          DIR="dist/${ARCHIVE_NAME}"
          mkdir -p "${DIR}"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/hadron.exe" "${DIR}/"
            cp "target/${{ matrix.target }}/release/hadron-gluon.exe" "${DIR}/"
            cp "target/${{ matrix.target }}/release/hadron-forge-mcp.exe" "${DIR}/"
            cp "crates/hadron-chamber/assets/hadron.ico" "${DIR}/"
            cd dist
            7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
            tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARCHIVE_NAME}.zip" > "${ARCHIVE_NAME}.zip.sha256"
              sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
            else
              shasum -a 256 "${ARCHIVE_NAME}.zip" > "${ARCHIVE_NAME}.zip.sha256"
              shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
            fi
          else
            cp "target/${{ matrix.target }}/release/hadron" "${DIR}/"
            cp "target/${{ matrix.target }}/release/hadron-gluon" "${DIR}/"
            cp "target/${{ matrix.target }}/release/hadron-forge-mcp" "${DIR}/"
            cp "crates/hadron-chamber/assets/hadron.ico" "${DIR}/"
            tar -czvf "dist/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
            else
              shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
            fi
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
