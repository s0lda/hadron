[workspace]
resolver = "2"
members = ["crates/hadron-lattice", "crates/hadron-gluon", "crates/hadron-chamber", "crates/hadron-forge", "crates/hadron-forge-mcp", "crates/hadron-gatekeeper"]
default-members = ["crates/hadron-chamber"]

# Every member declared the same four fields independently, which is six copies of
# one fact — a version bump had to be made in six files and could be made in five.
# Inherited with `<field>.workspace = true`; only `description` stays per-crate,
# because it is the one thing that genuinely differs.
#
# `repository` and `homepage` are deliberately ABSENT rather than placeholders: a
# published manifest is effectively permanent, and a broken URL is worse than a
# missing field (neither is required by `cargo publish`).
#
# No `rust-version`. It is the field people actually hit, so it has to be MEASURED
# against older toolchains rather than guessed — this box builds on 1.96.0 and that
# is evidence of nothing about the floor.
[workspace.package]
version = "0.16.0"
edition = "2021"
license = "Apache-2.0"

# Optimize *dependencies* even in a debug build, while our own crates stay at
# opt-level 0 (fast to rebuild, still debuggable). This is the standard GPUI/Zed
# posture and it is not cosmetic: the chamber's per-frame cost lives almost
# entirely in dependencies — GPUI's text shaping and layout, markdown parsing,
# and tree-sitter syntax highlighting. Unoptimized, those make the UI stutter
# while typing and scrolling; at opt-level 2 they are a different application.
[profile.dev.package."*"]
opt-level = 2

# The GPUI text/highlight path is hot enough to be worth optimizing even when
# it *is* one of our own crates' inline generics.
[profile.dev]
opt-level = 1

# `gpui-component`'s `TextMark` can express a highlight (a *background*) but has no
# foreground colour, so a mention could only ever be a tinted block, never coloured
# text. This fork branches from the same commit we already pinned and adds
# `TextMark::color`, parsed from `<span style="color: …">`. It is a small, upstreamable
# patch, not a divergence — drop this section the moment longbridge takes it.
#
# Pinned to a `rev`, never a branch: Cargo.lock pins a rev regardless, so a branch
# spec only hides which commit is actually in use. The URL must stay fetchable by a
# stranger — a `file:///` path here made a fresh clone unresolvable on every machine
# but the author's, which broke `git clone`, `cargo install --git` and CI at once.
[patch."https://github.com/longbridge/gpui-component"]
gpui-component = { git = "https://github.com/s0lda/gpui-component", rev = "b7bc424dfe80a3de7b8d5a8132fef7c79b447057" }
gpui-component-macros = { git = "https://github.com/s0lda/gpui-component", rev = "b7bc424dfe80a3de7b8d5a8132fef7c79b447057" }
gpui-component-assets = { git = "https://github.com/s0lda/gpui-component", rev = "b7bc424dfe80a3de7b8d5a8132fef7c79b447057" }
