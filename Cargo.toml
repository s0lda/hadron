[workspace]
resolver = "2"
members = ["crates/hadron-lattice", "crates/hadron-gluon", "crates/hadron-chamber", "crates/hadron-forge", "crates/hadron-forge-mcp", "crates/hadron-gatekeeper"]
default-members = ["crates/hadron-chamber"]

# Every member declared the same four fields independently, which is six copies of
# one fact — a version bump had to be made in six files and could be made in five.
# Inherited with `<field>.workspace = true`; only `description` stays per-crate,
# because it is the one thing that genuinely differs.
#
# `repository` and `homepage` are deliberately ABSENT rather than placeholders: a
# published manifest is effectively permanent, and a broken URL is worse than a
# missing field (neither is required by `cargo publish`).
#
# `rust-version` measured 2026-09-30 (issue #2): pinned `gpui_util` (zed-industries/zed@b2d9c2e122)
# calls `[T]::as_array`, which was stabilized in Rust 1.93.0 (`core_slice_as_array`,
# rust-lang/rust#133508). Older toolchains fail with E0658 during dependency build.
[workspace.package]
rust-version = "1.93"
version = "0.33.48"
edition = "2021"
license = "Apache-2.0"

# Optimize *dependencies* even in a debug build, while our own crates stay at
# opt-level 0 (fast to rebuild, still debuggable). This is the standard GPUI/Zed
# posture and it is not cosmetic: the chamber's per-frame cost lives almost
# entirely in dependencies — GPUI's text shaping and layout, markdown parsing,
# and tree-sitter syntax highlighting. Unoptimized, those make the UI stutter
# while typing and scrolling; at opt-level 2 they are a different application.
[profile.dev.package."*"]
opt-level = 2

# The GPUI text/highlight path is hot enough to be worth optimizing even when
# it *is* one of our own crates' inline generics.
[profile.dev]
opt-level = 1

