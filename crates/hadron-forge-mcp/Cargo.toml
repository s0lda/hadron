[package]
name = "hadron-forge-mcp"
description = "An MCP stdio server exposing hadron-forge's hash-checked edit, write, create, delete and read-blocks tools"
version.workspace = true
edition.workspace = true
license.workspace = true
# Flip to publish. Blocked today regardless: the workspace patches
# gpui-component from a `file:///` path, which crates.io rejects.
publish = false

[dependencies]
hadron-forge = { path = "../hadron-forge" }
rmcp = { version = "2.2.0", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"

