[package]
name = "hadron-gluon"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "8"
hadron-lattice = { path = "../hadron-lattice" }
hadron-gatekeeper = { path = "../hadron-gatekeeper" }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
ulid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "time",
    "sync",
] }
agent-client-protocol = { version = "1.2.0", features = ["unstable_end_turn_token_usage"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
