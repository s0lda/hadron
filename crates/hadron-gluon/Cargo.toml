[package]
name = "hadron-gluon"
description = "The Hadron swarm daemon: turn routing, permission gating, isolated git worktrees and an auto-merge gate"
version.workspace = true
edition.workspace = true
license.workspace = true
# Flip to publish. Blocked today regardless: the workspace patches
# gpui-component from a `file:///` path, which crates.io rejects.
publish = false

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "8"
hadron-lattice = { path = "../hadron-lattice" }
hadron-gatekeeper = { path = "../hadron-gatekeeper" }
hadron-forge = { path = "../hadron-forge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
async-trait = "0.1"
ulid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "time",
    "sync",
    "signal",
    "net",
] }
agent-client-protocol = { version = "1.2.0", features = ["unstable_end_turn_token_usage"] }
futures = "0.3"
async-io = "2"
chrono = "0.4.45"
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }
libc = "0.2"
# Local HTTP transport (Ollama / LM Studio): both are plain `http://localhost`, so no
# TLS backend is enabled — a keyless localhost seat has no use for one. `blocking` is
# for the chamber's Connect-button model-list probe, which (like the ACP probe it
# mirrors) runs off a plain background thread with no tokio reactor of its own.
# `rustls-tls` is not optional: without a TLS backend reqwest refuses every `https://`
# URL outright ("invalid URL, scheme is not http"), which broke every cloud
# OpenAI-compatible seat (OpenRouter et al.) while the keyless localhost vendors kept
# working. rustls over the bundled webpki roots, so there is no system OpenSSL dep.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }

[dev-dependencies]
chrono = "0.4.45"
tempfile = "3"
