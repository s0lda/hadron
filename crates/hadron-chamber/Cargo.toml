[package]
name = "hadron-chamber"
version = "0.1.0"
edition = "2021"

[dependencies]
hadron-lattice = { path = "../hadron-lattice" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GPUI is optional and off by default so the pure view-model + config build/test
# without it. The window lives behind `--features gui`. See Plan 4.
gpui = { version = "0.2", optional = true }

[features]
gui = ["dep:gpui"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "hadron-chamber"
path = "src/main.rs"
