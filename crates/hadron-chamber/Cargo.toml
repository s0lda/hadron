# This is the ONE installable package: `cargo install --git <url> hadron`.
#
# `cargo install --git <url> <pkg>` resolves <pkg> against this repository's own
# workspace members, never against crates.io — so the name `hadron` being taken on
# the registry (PsiACE's Spin runtime, 0.0.0, measured 2026-07-26) does not block
# the install path. It does mean this package can never be published, which costs
# nothing: it depends on `gpui`/`gpui_platform` by git URL and crates.io refuses git
# dependencies outright. The five library crates keep their own free names.
#
# The directory stays `crates/hadron-chamber/` — a package name and its directory
# name are independent, and renaming the directory would rewrite every path in the
# docs and the nucleus for no gain.
[package]
name = "hadron"
description = "A desktop chamber for orchestrating a swarm of AI coding agents across isolated git worktrees"
version.workspace = true
edition.workspace = true
license.workspace = true
# Never publishable: git deps on gpui/gpui_platform, which crates.io refuses.
publish = false
build = "build.rs"
include = ["src/**/*", "assets/**/*", "Cargo.toml", "README.md", "build.rs"]

# All three binaries ship from this one package, and that is load-bearing rather
# than tidy: the chamber resolves `hadron-gluon` as a sibling of its own
# `current_exe` (`src/main.rs:211`) and the daemon resolves `hadron-forge-mcp` as a
# sibling of ITS own (`hadron-gluon/src/adapter/acp/session.rs:494`). Installing one
# package's bins and letting the other two fall back to a bare PATH name is a silent
# miss — the daemon never starts and no error names a path. One package makes the
# sibling chain a structural guarantee instead of an install instruction to get wrong.
[[bin]]
name = "hadron"
path = "src/main.rs"

[[bin]]
name = "hadron-gluon"
path = "src/bin/hadron-gluon.rs"

[[bin]]
name = "hadron-forge-mcp"
path = "src/bin/hadron-forge-mcp.rs"

[dependencies]
hadron-lattice = { path = "../hadron-lattice" }
hadron-forge = { path = "../hadron-forge" }
hadron-gluon = { path = "../hadron-gluon" }
hadron-forge-mcp = { path = "../hadron-forge-mcp" }
hadron-gatekeeper = { path = "../hadron-gatekeeper" }
# Only the two bin shims need a runtime; the chamber itself is not async.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GPUI stack from git (Zed's live gpui + longbridge's component library), matching
# how Zed itself is built — needed for frameless windows on WSLg (Wayland) and
# ready-made TitleBar / Input / resizable Dock panels. Off by default (heavy);
# behind `--features gui`. Cargo.lock pins the exact commits (reproducibility).
gpui = { git = "https://github.com/zed-industries/zed", optional = true, features = ["test-support", "windows-manifest"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
], optional = true }
# `tree-sitter-languages` compiles the grammars in. Without it the highlighter has
# no language to parse with, so fenced code blocks render unstyled whatever theme is set.
gpui-component = { git = "https://github.com/longbridge/gpui-component", optional = true, features = [
    "tree-sitter-languages",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", optional = true }
lsp-types = "0.97.0"
emojis = "0.9.0"
anyhow = "1.0.103"
markdown = { version = "1.0.0", optional = true }
agent-client-protocol = "1.2.0"
chrono = "0.4.45"
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
libc = "0.2"
# `bundled` compiles SQLite in, so the build needs no system libsqlite3 — the
# same posture hadron-gluon already declares. A workspace build unifies the two
# anyway; stating it here keeps a standalone `-p hadron-chamber` build hermetic
# on a machine (Windows) that ships no sqlite.
rusqlite = { version = "0.31", features = ["bundled"] }

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui_platform", "dep:gpui-component", "dep:gpui-component-assets", "dep:markdown"]

[dev-dependencies]
tempfile = "3"
gpui_wgpu = { git = "https://github.com/zed-industries/zed" }

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }
