[package]
name = "hadron-lattice"
description = "Storage, events and telemetry for a Hadron swarm: the append-only field, the ledger, and live activity"
version.workspace = true
edition.workspace = true
license.workspace = true
# Flip to publish. Blocked today regardless: the workspace patches
# gpui-component from a `file:///` path, which crates.io rejects.
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
