[package]
name = "hadron-lattice"
description = "Storage, events and telemetry for a Hadron swarm: the append-only field, the ledger, and live activity"
version.workspace = true
edition.workspace = true
license.workspace = true
# Flip to publish. Blocked today regardless: the workspace patches
# gpui-component from a `file:///` path, which crates.io rejects.
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
dunce = "1.0"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }


