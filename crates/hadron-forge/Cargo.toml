[package]
name = "hadron-forge"
description = "Compare-and-swap file editing by content hash, with an AST block parser for Rust, Python, TypeScript and Go"
version.workspace = true
edition.workspace = true
license.workspace = true
# Flip to publish. Blocked today regardless: the workspace patches
# gpui-component from a `file:///` path, which crates.io rejects.
publish = false

[dependencies]
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
blake3 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"


